name: Move Files Out of Folder

on:
  workflow_dispatch:

jobs:
  move-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Move files from folder to root
        run: |
          bash -c 'shopt -s dotglob; mv NOVIQ-Living-Enterprise-City-v8/* . && rmdir NOVIQ-Living-Enterprise-City-v8'
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Move files from NOVIQ-Living-Enterprise-City-v8 folder to root"
      
      - name: Push changes
        run: |
          git push
