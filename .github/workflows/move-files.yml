name: Move Files Out of Folder

on:
  workflow_dispatch:

jobs:
  move-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Move files using Python
        run: |
          import os
          import shutil
          
          source_dir = "NOVIQ-Living-Enterprise-City-v8"
          
          # Copy all files and folders to root
          for item in os.listdir(source_dir):
              src = os.path.join(source_dir, item)
              dst = item
              
              if os.path.isdir(src):
                  if os.path.exists(dst):
                      shutil.rmtree(dst)
                  shutil.copytree(src, dst)
              else:
                  shutil.copy2(src, dst)
          
          # Remove the original folder
          shutil.rmtree(source_dir)
          
          # Remove ZIP file
          if os.path.exists("NOVIQ-Living-Enterprise-City-v8.zip"):
              os.remove("NOVIQ-Living-Enterprise-City-v8.zip")
        shell: python
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Move files from NOVIQ-Living-Enterprise-City-v8 folder to root" || echo "No changes to commit"
      
      - name: Push changes
        run: |
          git push origin main || echo "Nothing to push"
